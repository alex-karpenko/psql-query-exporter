[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `astral-tokio-tar` is unmaintained, no safe upgrade available.
    # Dev-only dependency pulled in by `testcontainers`, not shipped in the binary.
    { id = "RUSTSEC-2026-0440", reason = "dev-only via testcontainers, no upgrade available" },
    # `chrono` is unmaintained.
    # Dev-only dependency pulled in by `testcontainers` -> `serde_with`, not shipped in the binary.
    { id = "RUSTSEC-2026-0543", reason = "dev-only via testcontainers, no upgrade available" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.93
exceptions = [{ allow = ["Zlib"], name = "tinyvec" }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[output]
feature-depth = 1
