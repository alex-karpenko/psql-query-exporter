[package]
name = "psql-query-exporter"
version = "0.3.8"
edition = "2024"
authors = ["Oleksii Karpenko <alexkarpenko@yahoo.com>"]
description = "PostgreSQL Query Prometheus exporter"
repository = "https://github.com/alex-karpenko/psql-query-exporter"
license = "MIT OR Apache-2.0"
keywords = ["postgres", "postgresql", "prometheus", "exporter"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
clap = { version = "4.6.7", features = ["derive"] }
envsubst = "0.2.1"
human-repr = "1.1.0"
humantime-serde = "1.1.1"
openssl = "0.10.81"
openssl-sys = "0.9.117"
postgres-openssl = "0.5.3"
prometheus = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
dtor = "1.0.6"
insta = { version = "1.49.0", features = ["yaml"] }
reqwest = { version = "0.13.5", default-features = false }
rstest = "0.28.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }
